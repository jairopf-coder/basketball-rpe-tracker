name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Lanzamiento manual (GitHub -> Actions -> Deploy to GitHub Pages -> Run workflow).
  # Solo para emergencias: permite desplegar saltándose los tests.
  workflow_dispatch:
    inputs:
      omitir_tests:
        description: 'Desplegar SIN pasar los tests (solo en emergencias)'
        type: boolean
        default: false

jobs:
  # 1) Tests: se ejecutan sobre lo que hay SUBIDO a git (un checkout limpio), así que también
  #    avisan de archivos que existen en tu ordenador pero que se olvidaron de subir.
  #    MODO AVISO: si algún test falla, la ejecución se marca en rojo y GitHub avisa por correo,
  #    pero el despliegue SIGUE adelante. Para pasar a modo BLOQUEO (que un test en rojo impida
  #    desplegar) hay que cambiar la condición del trabajo «deploy» (ver el comentario de abajo).
  test:
    name: Tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.omitir_tests) }}
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid   # los tests de fechas asumen la zona horaria del equipo (el servidor va en UTC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Placeholder de firebase-config.js
        # firebase-config.js no está en git (credenciales). Un test comprueba que está en la lista de
        # caché del service worker, así que basta con que exista; el real lo genera el trabajo «deploy».
        run: echo "// El archivo real lo genera el trabajo deploy a partir del secreto FIREBASE_CONFIG" > firebase-config.js

      - name: Run tests
        run: node scripts/run-tests.js

  # 2) Despliegue. Modo aviso: se despliega aunque los tests hayan fallado (solo no si se cancela la ejecución).
  #    Modo BLOQUEO: sustituir la condición por la siguiente (solo despliega si los tests pasan o se omitieron):
  #      if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
  deploy:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inject Firebase config (from GitHub Secret)
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          {
            echo "const firebaseConfig = ${FIREBASE_CONFIG};"
            echo "if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }"
            echo "firebase.database().goOnline();"
            echo "firebase.database().ref('.info/connected').on('value', function(){});"
            echo "window.firebaseDB   = firebase.database();"
            echo "window.firebaseAuth = firebase.auth();"
            echo "if (window._devMode) console.log('🟢 Firebase inicializado correctamente (Auth + Database)');"
          } > firebase-config.js
          echo "=== firebase-config.js generado ==="
          ls -la firebase-config.js
          head -2 firebase-config.js

      - name: Stamp service worker version (unique per deploy)
        run: |
          # sw.js: CACHE_VERSION = 'v143' pasa a 'v143-b87' (b + nº de ejecución de este despliegue).
          # Cada despliegue deja una versión distinta: los móviles reinstalan el service worker y
          # refrescan su caché sin tener que subir la versión a mano.
          sed -i -E "s/^(const CACHE_VERSION = '[^']*)(';)/\1-b${GITHUB_RUN_NUMBER}\2/" sw.js
          if grep -q -E "^const CACHE_VERSION = '[^']*-b${GITHUB_RUN_NUMBER}';" sw.js; then
            grep -n "^const CACHE_VERSION" sw.js
          else
            echo "::warning::No se pudo sellar CACHE_VERSION en sw.js (¿ha cambiado su formato?). El despliegue sigue con la versión del repositorio."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,*.md,*.TEMPLATE.js,server.js,deploy.md,.gitignore,scripts,test'
